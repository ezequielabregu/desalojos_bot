name: Scrape noticias de desalojos

on:
  schedule:
    # Corre una vez por hora, en el minuto 17 (no en punto). GitHub retrasa o
    # directamente saltea corridas programadas para el minuto 0 de cada hora
    # por ser el momento de mayor congestión en todos sus runners; correr en
    # un minuto "raro" reduce bastante ese riesgo. Aun así, GitHub no
    # garantiza el minuto exacto de ejecución.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas (ej. una programada y una manual) pusheen a la vez
# y choquen; en vez de cancelarse, la segunda espera a que termine la primera.
concurrency:
  group: scrape-noticias-desalojos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Correr scraper
        run: python scraper/scrape.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts scraper/data/seen.json _data/status.yml
          if git diff --cached --quiet; then
            echo "Nada que commitear (no debería pasar: status.yml cambia siempre)."
            exit 0
          fi

          new_count=$(grep -oE 'new_articles: [0-9]+' _data/status.yml | grep -oE '[0-9]+')
          if [ "${new_count:-0}" = "0" ]; then
            msg="Verificación automática $(date -u +'%Y-%m-%d %H:%M UTC'), sin noticias nuevas"
          else
            msg="Actualiza noticias de desalojos $(date -u +'%Y-%m-%d'): $new_count nueva(s)"
          fi
          git commit -m "$msg"
          git push
