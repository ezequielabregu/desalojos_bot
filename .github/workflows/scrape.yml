name: Scrape noticias de desalojos

on:
  schedule:
    # Corre una vez por hora, en el minuto 17 (no en punto). GitHub retrasa o
    # directamente saltea corridas programadas para el minuto 0 de cada hora
    # por ser el momento de mayor congestión en todos sus runners; correr en
    # un minuto "raro" reduce bastante ese riesgo. Aun así, GitHub no
    # garantiza el minuto exacto de ejecución.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Evita que dos corridas (ej. una programada y una manual) pusheen a la vez
# y choquen; en vez de cancelarse, la segunda espera a que termine la primera.
concurrency:
  group: scrape-noticias-desalojos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Correr scraper
        run: python scraper/scrape.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts scraper/data/seen.json
          if git diff --cached --quiet; then
            echo "No hay noticias nuevas."
          else
            git commit -m "Actualiza noticias de desalojos $(date -u +'%Y-%m-%d')"
            git push
          fi
