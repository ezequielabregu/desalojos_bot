name: Scrape noticias de desalojos

on:
  schedule:
    # 12:00 UTC ~ 09:00 en Argentina (UTC-3). Ajustar si cambia el horario.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Correr scraper
        run: python scraper/scrape.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts scraper/data/seen.json
          if git diff --cached --quiet; then
            echo "No hay noticias nuevas."
          else
            git commit -m "Actualiza noticias de desalojos $(date -u +'%Y-%m-%d')"
            git push
          fi
