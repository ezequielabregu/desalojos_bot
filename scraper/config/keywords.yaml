# Palabras/frases clave usadas para filtrar artículos relacionados a desalojos.
# La comparación se hace en minúsculas y sin distinguir mayúsculas/acentos
# exactos (ver normalize() en fetch_sources.py).

keywords:
  - desalojo
  - desalojos
  - desalojar
  - desalojado
  - desalojados
  - desalojada
  - desalojadas
  - orden de desalojo
  - juicio de desalojo
  - toma de tierras
  - usurpacion
  - lanzamiento judicial

# Si un artículo matchea alguna keyword de arriba PERO también contiene
# alguna de estas frases, se descarta igual. Existen porque "desalojo" en
# español también se usa para evacuaciones (amenazas de bomba, alarmas,
# etc.), que no tienen nada que ver con un desalojo habitacional/judicial.
exclude_keywords:
  - protocolo antibomba
  - amenaza de bomba
  - bulto sospechoso
  - falsa alarma
  - paquete sospechoso
