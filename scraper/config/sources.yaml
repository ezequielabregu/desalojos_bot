# Lista de fuentes confiables.
#
# Cada fuente debe tener:
#   name:     nombre para mostrar / atribución
#   homepage: sitio principal (usado también para validar el dominio del link)
#   rss_url:  URL del feed RSS/Atom (preferido)
#
# Si un medio no tiene RSS pero sí expone un sitemap de noticias de Google
# (formato estándar que muchos medios generan aunque no tengan RSS propio,
# ver robots.txt del sitio para encontrarlo), se puede usar en su lugar:
#   news_sitemap_url: URL del sitemap-news.xml
#
# Si un medio no tiene ninguna de las dos opciones anteriores, se puede
# definir un fallback de scraping HTML con:
#   html_url:        URL de la sección/tag a scrapear (ej. listado de notas)
#   article_selector: selector CSS de cada link de artículo en esa página
#
# Se usan feeds de SECCIÓN (sociedad, policiales, etc.) en vez de portada
# general: un desalojo puntual casi nunca llega a tapa nacional, pero sí
# suele aparecer en esas secciones. Cada rss_url de abajo fue verificado
# manualmente (respondía 200 con entradas reales) al momento de agregarlo.
#
# IMPORTANTE: las URLs de RSS cambian con el tiempo y deben re-verificarse
# de tanto en tanto (ver README para cómo probar cada una).

sources:
  - name: Clarín
    homepage: https://www.clarin.com
    rss_url: https://www.clarin.com/rss/policiales/

  - name: Clarín
    homepage: https://www.clarin.com
    rss_url: https://www.clarin.com/rss/sociedad/

  - name: La Nación
    homepage: https://www.lanacion.com.ar
    rss_url: https://www.lanacion.com.ar/arc/outboundfeeds/rss/category/sociedad/

  - name: Infobae
    homepage: https://www.infobae.com
    rss_url: https://www.infobae.com/arc/outboundfeeds/rss/category/sociedad/

  - name: Página/12
    homepage: https://www.pagina12.com.ar
    rss_url: https://www.pagina12.com.ar/arc/outboundfeeds/rss/secciones/sociedad/notas

  - name: Página/12
    homepage: https://www.pagina12.com.ar
    rss_url: https://www.pagina12.com.ar/arc/outboundfeeds/rss/secciones/el-pais/notas

  - name: Perfil
    homepage: https://www.perfil.com
    rss_url: https://www.perfil.com/rss/sociedad

  - name: Perfil
    homepage: https://www.perfil.com
    rss_url: https://www.perfil.com/rss/policia

  - name: Ámbito Financiero
    homepage: https://www.ambito.com
    # Ámbito no tiene sección propia de sociedad/policiales; "nacional" es
    # la más cercana disponible en su listado de feeds (ambito.com/contenidos/rss.html).
    rss_url: https://www.ambito.com/rss/pages/nacional.xml

  - name: TN
    homepage: https://tn.com.ar
    # TN no expone feeds por sección (solo el de portada funciona), se mantiene
    # el de portada general como única opción disponible para este medio.
    rss_url: https://tn.com.ar/feed/

  - name: La Izquierda Diario
    homepage: https://www.laizquierdadiario.com
    rss_url: https://www.laizquierdadiario.com/spip.php?page=backend

  - name: Minuto Uno
    homepage: https://www.minutouno.com
    # No tiene RSS propio; se usa su sitemap de noticias de Google (últimas ~48hs).
    news_sitemap_url: https://www.minutouno.com/sitemap-news.xml

  - name: iProfesional
    homepage: https://www.iprofesional.com
    # No tiene RSS; usa sitemap de noticias de Google. Tienen uno específico
    # de la sección real estate, más targeteado que el general del sitio.
    news_sitemap_url: https://www.iprofesional.com/sitemap-news.realestate.xml

  - name: La Política Online
    homepage: https://www.lapoliticaonline.com
    # No tiene sección propia de sociedad/policiales; se usa la portada
    # de la edición Argentina (hay también una edición España aparte).
    rss_url: https://www.lapoliticaonline.com/files/rss/ultimasnoticias.xml

  - name: El Cronista
    homepage: https://www.cronista.com
    # CMS Arc (como La Nación/Infobae). No tiene sección de inmuebles/sociedad
    # propia entre sus categorías; se usa la portada general.
    rss_url: https://www.cronista.com/arc/outboundfeeds/rss/

  - name: PCR
    homepage: https://pcr.org.ar
    rss_url: https://pcr.org.ar/feed/

# Fuentes evaluadas y descartadas por ahora (ver README):
#   - Reporte Inmobiliario: su infraestructura bloquea/cuelga cualquier
#     acceso automatizado (RSS, sitemap y hasta robots.txt fallan).
#   - Tiempo Argentino: su RSS está publicando spam (posible sitio
#     comprometido) a la fecha en que se evaluó. Re-evaluar más adelante.
